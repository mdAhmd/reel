<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="A minimal, swipeable Instagram Reel collection.">
  <title>Reels</title>
  <style>
    :root{color-scheme:dark;--bg:#080808;--white:#fff;--muted:rgba(255,255,255,.72);--accent:#ff3158;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit}
    button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:4px}
    #app,.page{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:var(--bg)}
    .page{display:none}.page.active{display:block}
    #feed{height:100%;height:100dvh;overflow-y:auto;overscroll-behavior-y:contain;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    #feed::-webkit-scrollbar{display:none}
    .reel{position:relative;width:100%;height:100%;height:100dvh;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#242126 0%,#111 50%,#080808 100%)}
    .reel::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.26),transparent 20%,transparent 66%,rgba(0,0,0,.34));z-index:1}
    .embed-area{position:relative;z-index:0;width:min(100%,540px);height:100%;display:grid;place-items:center;overflow:hidden}
    .embed-shell{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
    .instagram-media{margin:0!important;width:min(100%,540px)!important;min-width:0!important;max-width:540px!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important}
    .instagram-media iframe{max-height:calc(100dvh - var(--safe-top) - var(--safe-bottom))!important}
    .placeholder{width:min(84vw,420px);height:min(76dvh,740px);border:1px solid rgba(255,255,255,.1);border-radius:24px;background:linear-gradient(155deg,rgba(255,255,255,.08),rgba(255,255,255,.015));display:grid;place-items:center;position:relative;overflow:hidden}
    .placeholder::before,.placeholder::after{content:"";position:absolute;border-radius:50%;filter:blur(1px);background:rgba(255,49,88,.12)}
    .placeholder::before{width:280px;height:280px;top:-130px;right:-110px}.placeholder::after{width:220px;height:220px;bottom:-100px;left:-80px;background:rgba(126,91,255,.13)}
    .placeholder-mark{position:relative;width:68px;height:68px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.24);border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(12px)}
    .placeholder-mark svg{width:28px;height:28px;fill:#fff;margin-left:3px}
    .reel-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72}
    .reel-actions{position:absolute;z-index:3;right:max(16px,calc((100vw - 540px)/2 + 18px));bottom:calc(28px + var(--safe-bottom));display:flex;flex-direction:column;align-items:center;gap:18px}
    .icon-button{width:52px;height:52px;border:1px solid rgba(255,255,255,.24);border-radius:50%;background:rgba(18,18,18,.48);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .18s ease,background .18s ease,border-color .18s ease}
    .icon-button:hover{transform:scale(1.06);background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.55)}
    .icon-button:active{transform:scale(.94)}.icon-button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .icon-button.reaction.is-sent svg{fill:var(--accent);stroke:var(--accent)}
    .top-actions{position:absolute;z-index:4;top:calc(16px + var(--safe-top));right:16px}
    .top-actions .icon-button{width:46px;height:46px}
    .reel-count{position:absolute;z-index:2;left:18px;bottom:calc(24px + var(--safe-bottom));padding:9px 13px;border:1px solid rgba(255,255,255,.16);border-radius:99px;background:rgba(0,0,0,.34);font-size:12px;letter-spacing:.04em;color:rgba(255,255,255,.86);backdrop-filter:blur(10px)}
    .load-state,.empty-state{min-height:100%;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;color:var(--muted)}
    .spinner{width:26px;height:26px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state p{margin:0;font-size:14px}.empty-state .icon-button{width:48px;height:48px}
    #gridPage{overflow:auto;overscroll-behavior:contain;padding:calc(16px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));background:#0b0b0c}
    .grid-top{max-width:1000px;margin:0 auto 20px;display:flex;align-items:center;gap:14px}
    .back-button{width:44px;height:44px;flex:0 0 44px;border:1px solid rgba(255,255,255,.16);border-radius:50%;background:#171719;display:grid;place-items:center;cursor:pointer}
    .back-button svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .grid-heading{min-width:0}.grid-heading h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.03em}.grid-heading p{margin:3px 0 0;color:var(--muted);font-size:12px}
    #grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .grid-item{position:relative;aspect-ratio:9/13;border:0;padding:0;overflow:hidden;border-radius:12px;background:linear-gradient(150deg,#29212a,#121216 70%);cursor:pointer}
    .grid-item img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .25s ease}.grid-item:hover img{transform:scale(1.04)}
    .grid-item::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.48));pointer-events:none}
    .grid-play{position:absolute;z-index:1;right:9px;bottom:9px;width:28px;height:28px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(0,0,0,.25);display:grid;place-items:center}
    .grid-play svg{width:12px;height:12px;fill:#fff;margin-left:1px}
    .grid-placeholder{position:absolute;inset:0;display:grid;place-items:center}.grid-placeholder svg{width:30px;height:30px;fill:rgba(255,255,255,.85)}
    .grid-empty{grid-column:1/-1;padding:60px 12px;text-align:center;color:var(--muted);font-size:14px}
    @media(min-width:700px){.reel{background:#090909}.reel-actions{right:max(24px,calc((100vw - 540px)/2 - 78px));bottom:50%;transform:translateY(50%)}.reel-count{left:max(24px,calc((100vw - 540px)/2 - 78px));bottom:24px}#gridPage{padding-left:28px;padding-right:28px}#grid{gap:12px}.grid-item{border-radius:16px}}
    @media(max-width:360px){.reel-actions{right:12px;gap:13px}.icon-button{width:46px;height:46px}.reel-count{left:12px;font-size:11px}#grid{gap:5px}.grid-item{border-radius:8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div id="app">
    <section id="feedPage" class="page active" aria-label="Reels">
      <main id="feed" aria-live="polite"><div class="load-state"><span class="spinner" aria-hidden="true"></span><span>Loading</span></div></main>
      <div class="top-actions"><button class="icon-button" id="openGrid" type="button" aria-label="Open Reel collection" title="Reel collection"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button></div>
    </section>
    <section id="gridPage" class="page" aria-label="All Reels" aria-hidden="true">
      <header class="grid-top"><button class="back-button" id="backButton" type="button" aria-label="Back to current Reel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><div class="grid-heading"><h1>Reels</h1><p id="gridCount">Your collection</p></div></header>
      <div id="grid"></div>
    </section>
  </div>
  <script>
    const SHEET_API_URL="https://script.google.com/macros/s/AKfycbzqBbaHZ1uDHiBoTZ_JqQvURzcwfLsP_KNecd9g4HJvhdM2BCGVfCv1u8iGttLJ0-iY/exec";
    const WHATSAPP_NUMBER="917869231186";
    const feed=document.getElementById("feed"),feedPage=document.getElementById("feedPage"),gridPage=document.getElementById("gridPage"),grid=document.getElementById("grid");
    let reels=[],slides=[],currentIndex=0,observer=null,instagramScriptPromise=null;
    const icon=(name)=>name==="heart"?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.7c0 5.2-8.8 10.1-8.8 10.1S3.2 13.9 3.2 8.7A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg>';
    function normalizeInstagramUrl(raw){try{const u=new URL(String(raw||"").trim()),host=u.hostname.toLowerCase().replace(/^www\./,"");if(!["instagram.com","instagr.am"].includes(host))return null;const m=u.pathname.match(/^\/(reel|reels|p|tv)\/([\w-]+)/i);if(!m)return null;return `https://www.instagram.com/${m[1]}/${m[2]}/`}catch{return null}}
    function jsonp(url){return new Promise((resolve,reject)=>{const callback="reels_cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6),script=document.createElement("script"),timer=setTimeout(()=>finish(new Error("timeout")),10000);function finish(error,data){clearTimeout(timer);delete window[callback];script.remove();error?reject(error):resolve(data)}window[callback]=data=>finish(null,data);script.onerror=()=>finish(new Error("network"));const separator=url.includes("?")?"&":"?";script.src=url+separator+"callback="+callback+"&_="+Date.now();document.head.appendChild(script)})}
    async function loadSheetData(url){const target=url+(url.includes("?")?"&":"?")+"_="+Date.now();try{const response=await fetch(target,{cache:"no-store",credentials:"omit"});if(!response.ok)throw new Error("request failed");return await response.json()}catch(error){return jsonp(url)}}
    function loadInstagramScript(){if(window.instgrm?.Embeds)return Promise.resolve();if(instagramScriptPromise)return instagramScriptPromise;instagramScriptPromise=new Promise((resolve,reject)=>{const script=document.createElement("script");script.async=true;script.src="https://www.instagram.com/embed.js";script.onload=()=>window.instgrm?.Embeds?resolve():reject(new Error("embed unavailable"));script.onerror=()=>reject(new Error("embed unavailable"));document.head.appendChild(script)});return instagramScriptPromise}
    function makeReel(reel,index){const section=document.createElement("section");section.className="reel";section.dataset.index=index;section.setAttribute("aria-label",`Reel ${index+1}`);const area=document.createElement("div");area.className="embed-area";const shell=document.createElement("div");shell.className="embed-shell";const placeholder=document.createElement("div");placeholder.className="placeholder";if(reel.thumbnail){const image=document.createElement("img");image.className="reel-thumb";image.src=reel.thumbnail;image.alt="";image.loading=index>1?"lazy":"eager";image.onerror=()=>image.remove();placeholder.appendChild(image)}const mark=document.createElement("span");mark.className="placeholder-mark";mark.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';placeholder.appendChild(mark);shell.appendChild(placeholder);area.appendChild(shell);section.appendChild(area);const actions=document.createElement("div");actions.className="reel-actions";const reaction=document.createElement("button");reaction.type="button";reaction.className="icon-button reaction";reaction.setAttribute("aria-label","Send a reaction");reaction.title="Send a reaction";reaction.innerHTML=icon("heart");reaction.addEventListener("click",()=>sendReaction(index,reaction));actions.appendChild(reaction);section.appendChild(actions);const count=document.createElement("div");count.className="reel-count";count.textContent=`${String(index+1).padStart(2,"0")} / ${String(reels.length).padStart(2,"0")}`;section.appendChild(count);return section}
    function showUnavailable(slide){const shell=slide.querySelector(".embed-shell");if(!shell||shell.dataset.failed)return;shell.dataset.failed="true";const reel=reels[Number(slide.dataset.index)];shell.innerHTML="";const card=document.createElement("a");card.className="placeholder";card.href=reel.url;card.target="_blank";card.rel="noopener noreferrer";card.setAttribute("aria-label","Open Reel on Instagram");const mark=document.createElement("span");mark.className="placeholder-mark";mark.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';card.appendChild(mark);shell.appendChild(card)}
    async function mountReel(slide){if(slide.dataset.loaded)return;slide.dataset.loaded="true";const reel=reels[Number(slide.dataset.index)],shell=slide.querySelector(".embed-shell");try{await loadInstagramScript();if(!shell.isConnected)return;const block=document.createElement("blockquote");block.className="instagram-media";block.dataset.instgrmPermalink=reel.url;block.dataset.instgrmVersion="14";shell.appendChild(block);window.instgrm.Embeds.process();setTimeout(()=>{if(!shell.querySelector("iframe"))showUnavailable(slide)},14000)}catch{showUnavailable(slide)}}
    function sendReaction(index,button){const reel=reels[index];if(!reel)return;button.classList.add("is-sent");button.setAttribute("aria-pressed","true");const phone=WHATSAPP_NUMBER.replace(/\D/g,"");const message=`I reacted to this Reel: ${reel.url}`;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`,"_blank","noopener,noreferrer")}
    function setCurrent(index){if(!Number.isInteger(index))return;currentIndex=index;for(let i=Math.max(0,index-1);i<=Math.min(slides.length-1,index+1);i++)mountReel(slides[i])}
    function openGrid(){feedPage.classList.remove("active");gridPage.classList.add("active");gridPage.setAttribute("aria-hidden","false");feedPage.setAttribute("aria-hidden","true");buildGrid()}
    function closeGrid(index=currentIndex){gridPage.classList.remove("active");gridPage.setAttribute("aria-hidden","true");feedPage.classList.add("active");feedPage.setAttribute("aria-hidden","false");if(Number.isInteger(index)&&slides[index]){currentIndex=index;slides[index].scrollIntoView({behavior:"instant",block:"start"});setCurrent(index)}}
    function buildGrid(){grid.replaceChildren();document.getElementById("gridCount").textContent=`${reels.length} ${reels.length===1?"Reel":"Reels"}`;if(!reels.length){const empty=document.createElement("div");empty.className="grid-empty";empty.textContent="Your collection is empty for now.";grid.appendChild(empty);return}reels.forEach((reel,index)=>{const button=document.createElement("button");button.type="button";button.className="grid-item";button.setAttribute("aria-label",`Play Reel ${index+1}`);if(reel.thumbnail){const image=document.createElement("img");image.src=reel.thumbnail;image.alt="";image.loading="lazy";image.onerror=()=>image.remove();button.appendChild(image)}else{const ph=document.createElement("span");ph.className="grid-placeholder";ph.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';button.appendChild(ph)}const play=document.createElement("span");play.className="grid-play";play.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';button.appendChild(play);button.addEventListener("click",()=>closeGrid(index));grid.appendChild(button)})}
    function render(data){const rows=Array.isArray(data)?data:(Array.isArray(data?.reels)?data.reels:[]);reels=rows.map(row=>({url:normalizeInstagramUrl(row?.url||row?.link||row?.instagram),thumbnail:String(row?.thumbnail||row?.image||row?.cover||"").trim()})).filter(reel=>reel.url);if(!reels.length){feed.innerHTML='<div class="empty-state"><p>There are no Reels to show yet.</p></div>';return}feed.replaceChildren();slides=reels.map(makeReel);slides.forEach(slide=>feed.appendChild(slide));if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting&&entry.intersectionRatio>=.55)setCurrent(Number(entry.target.dataset.index))}},{root:feed,threshold:[.55,.75]});slides.forEach(slide=>observer.observe(slide));setCurrent(0)}
    async function refreshReels(){try{const result=await loadSheetData(SHEET_API_URL);render(result)}catch{feed.innerHTML='<div class="empty-state"><p>Reels are taking a moment to load.</p><button class="icon-button" id="retryButton" type="button" aria-label="Try loading again" title="Try again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 11.6-2L20 12M4 12l2.9 5a7 7 0 0 0 11.6-2"/></svg></button></div>';document.getElementById("retryButton").addEventListener("click",()=>{feed.innerHTML='<div class="load-state"><span class="spinner" aria-hidden="true"></span><span>Loading</span></div>';refreshReels()})}}
    document.getElementById("openGrid").addEventListener("click",openGrid);document.getElementById("backButton").addEventListener("click",()=>closeGrid(currentIndex));
    document.addEventListener("keydown",event=>{if(gridPage.classList.contains("active")){if(event.key==="Escape"||event.key==="ArrowLeft")closeGrid(currentIndex);return}if(event.key==="ArrowDown"||event.key==="PageDown"){event.preventDefault();slides[Math.min(currentIndex+1,slides.length-1)]?.scrollIntoView({behavior:"smooth"})}else if(event.key==="ArrowUp"||event.key==="PageUp"){event.preventDefault();slides[Math.max(currentIndex-1,0)]?.scrollIntoView({behavior:"smooth"})}});
    refreshReels();
  </script>
</body>
</html>
