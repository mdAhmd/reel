<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="A minimal, swipeable Instagram Reel collection.">
<title>Reels</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit}#app{height:100%;height:100dvh;width:100%;overflow:hidden;position:relative;background:#000}.page{position:absolute;inset:0;background:#000;display:none}.page.active{display:block}#feedPage{overflow:hidden}#feed{height:100%;height:100dvh;width:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}#feed::-webkit-scrollbar,#gridPage::-webkit-scrollbar{display:none}.reel{height:100%;height:100dvh;width:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}.embed-area{height:100%;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}.embed-area blockquote.instagram-media{margin:0 auto!important;max-width:540px!important;min-width:0!important;width:100%!important;border:0!important;border-radius:0!important;background:#000!important}.embed-area iframe{max-width:100%!important}.reel-loading{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#aaa;font-size:13px;text-align:center;padding:24px}.reel-loading a{display:inline-block;margin-top:14px;padding:11px 16px;border:1px solid #ffffff50;border-radius:24px;background:#171717;color:#fff;text-decoration:none;font-weight:600}.loader{width:22px;height:22px;border:2px solid #ffffff30;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.reel-overlay{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px}.action-button{min-width:44px;height:44px;border:1px solid #ffffff45;border-radius:24px;background:#111a;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px)}.action-button:active{background:#333}.react-button{font-size:20px}.view-button{padding:0 12px;gap:7px;font-size:12px;font-weight:600;white-space:nowrap}.credit{position:fixed;z-index:4;left:50%;bottom:max(7px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:9px;color:#ffffff75;white-space:nowrap;text-decoration:none}#gridPage{overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);scrollbar-width:none}.grid-top{height:48px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4;background:#000;padding:0 4px}.back-button{border:0;background:transparent;color:#fff;font-size:14px;padding:10px 8px;cursor:pointer}.grid-title{font-size:13px;color:#ddd}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.grid-item{aspect-ratio:9/14;position:relative;overflow:hidden;border:0;padding:0;background:linear-gradient(145deg,#28232c,#101012);cursor:pointer}.grid-item img{width:100%;height:100%;object-fit:cover;display:block}.grid-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;font-size:24px;background:linear-gradient(145deg,#28232c,#101012)}.grid-item:after{content:"▶";position:absolute;right:8px;top:8px;color:#fff;text-shadow:0 1px 5px #000;font-size:13px}.grid-empty,.error-state{padding:40px 16px;text-align:center;color:#aaa;font-size:13px;line-height:1.6}.error-state strong{display:block;color:#fff;font-size:17px;margin-bottom:8px}.error-state a{color:#fff}.error-state button{display:block;margin:18px auto 0;padding:10px 16px;border:1px solid #ffffff50;border-radius:22px;background:#171717;color:#fff;cursor:pointer}@media(min-width:700px){.embed-area blockquote.instagram-media{max-width:min(100%,540px)!important}.reel-overlay{right:max(24px,calc((100vw - 620px)/2));bottom:38px}.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:1200px;margin:auto}.grid-top{max-width:1200px;margin:auto}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <section id="feedPage" class="page active" aria-label="Reels"><main id="feed"><div class="error-state"><div class="loader"></div>Loading Reels…</div></main><a class="credit" href="https://www.linkedin.com/in/mohdahmedd/" target="_blank" rel="noopener noreferrer">Developed By Mohd Ahmed</a></section>
  <section id="gridPage" class="page" aria-label="All Reels"><div class="grid-top"><button class="back-button" id="backButton" type="button">‹ Back to Reel</button><div class="grid-title">All Reels</div><span style="width:88px"></span></div><div id="grid" class="grid"></div></section>
</div>
<script>
const SHEET_API_URL="https://script.google.com/macros/s/AKfycbzqBbaHZ1uDHiBoTZ_JqQvURzcwfLsP_KNecd9g4HJvhdM2BCGVfCv1u8iGttLJ0-iY/exec";
const WHATSAPP_NUMBER="917869231186";
const feed=document.getElementById("feed"),feedPage=document.getElementById("feedPage"),gridPage=document.getElementById("gridPage"),grid=document.getElementById("grid");
let reels=[],slides=[],currentIndex=0,observer=null,instagramScriptPromise=null,touchStart=null;
function normalizeInstagramUrl(raw){try{const u=new URL(String(raw||"").trim()),host=u.hostname.toLowerCase().replace(/^www\./,"");if(!["instagram.com","instagr.am"].includes(host))return null;const m=u.pathname.match(/^\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)\/?/);if(!m)return null;return `https://www.instagram.com/${m[1].toLowerCase()==="reels"?"reel":m[1].toLowerCase()}/${m[2]}/`}catch{return null}}
function jsonp(url){return new Promise((resolve,reject)=>{const cb="rr_"+Date.now()+"_"+Math.floor(Math.random()*1e6),script=document.createElement("script"),timer=setTimeout(()=>{cleanup();reject(new Error("Google Sheets did not respond."))},15000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error("Could not connect to Google Sheets. Check that the Web App is deployed for public access."))};script.src=url+(url.includes("?")?"&":"?")+"callback="+cb+"&_="+Date.now();document.body.appendChild(script)})}
async function loadSheetData(url){try{const response=await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store",credentials:"omit"});if(!response.ok)throw new Error(`HTTP ${response.status}`);const text=await response.text();try{return JSON.parse(text)}catch{const match=text.match(/^\s*[A-Za-z_$][\w$]*\s*\((.*)\)\s*;?\s*$/s);if(!match)throw new Error("Unexpected response from Google Sheets.");return JSON.parse(match[1])}}catch{return jsonp(url)}}
function loadInstagramScript(){if(window.instgrm?.Embeds)return Promise.resolve();if(instagramScriptPromise)return instagramScriptPromise;instagramScriptPromise=new Promise((resolve,reject)=>{const s=document.createElement("script");s.async=true;s.src="https://www.instagram.com/embed.js";s.onload=resolve;s.onerror=()=>reject(new Error("Instagram embed script failed to load."));document.body.appendChild(s)});return instagramScriptPromise}
function showFeedError(message){feed.innerHTML="";const box=document.createElement("div");box.className="error-state";const strong=document.createElement("strong");strong.textContent="Reels couldn't load";const p=document.createElement("div");p.textContent=message;const retry=document.createElement("button");retry.textContent="Try again";retry.onclick=refreshReels;box.append(strong,p,retry);feed.append(box)}
function makeReel(reel,index){const section=document.createElement("section");section.className="reel";section.dataset.index=index;const area=document.createElement("div");area.className="embed-area";const loading=document.createElement("div");loading.className="reel-loading";loading.innerHTML='<div><div class="loader"></div>Loading Reel…</div>';area.append(loading);const overlay=document.createElement("div");overlay.className="reel-overlay";const view=document.createElement("button");view.className="action-button view-button";view.type="button";view.innerHTML="▦ <span>View all Reels</span>";view.setAttribute("aria-label","View all Reels");view.onclick=openGrid;const react=document.createElement("button");react.className="action-button react-button";react.type="button";react.textContent="♡";react.setAttribute("aria-label","Send reaction");react.onclick=()=>sendReaction(index);overlay.append(view,react);section.append(area,overlay);Object.assign(section,{_area:area,_url:reel.url,_loaded:false});feed.append(section);slides.push(section)}
function showEmbedError(slide){const note=document.createElement("div");note.className="reel-loading";const content=document.createElement("div"),text=document.createElement("div"),link=document.createElement("a");text.textContent="This Reel couldn't be loaded here.";link.href=slide._url;link.target="_blank";link.rel="noopener noreferrer";link.textContent="Open this Reel on Instagram";content.append(text,link);note.append(content);slide._area.replaceChildren(note)}
async function mountReel(slide){if(slide._loaded)return;slide._loaded=true;const block=document.createElement("blockquote");block.className="instagram-media";block.dataset.instgrmPermalink=slide._url;block.dataset.instgrmVersion="14";block.style.cssText="background:#000;border:0;margin:0 auto;max-width:540px;min-width:0;padding:0;width:100%";const fallback=document.createElement("a");fallback.href=slide._url;fallback.target="_blank";fallback.rel="noopener noreferrer";fallback.textContent="View on Instagram";block.append(fallback);slide._area.replaceChildren(block);try{await loadInstagramScript();if(!window.instgrm?.Embeds)throw new Error("Instagram player unavailable");window.instgrm.Embeds.process();setTimeout(()=>{if(slide.isConnected&&!slide._area.querySelector("iframe"))showEmbedError(slide)},16000)}catch{showEmbedError(slide)}}
function sendReaction(index){const reel=reels[index];if(!reel)return;const phone=WHATSAPP_NUMBER.replace(/\D/g,"");window.open(`https://wa.me/${phone}?text=${encodeURIComponent(`I reacted to this Reel\n${reel.url}`)}`,"_blank","noopener,noreferrer")}
function openGrid(){feedPage.classList.remove("active");gridPage.classList.add("active");buildGrid()}
function closeGrid(index){gridPage.classList.remove("active");feedPage.classList.add("active");if(Number.isInteger(index)&&slides[index]){currentIndex=index;slides[index].scrollIntoView({behavior:"instant",block:"start"});mountReel(slides[index])}}
function buildGrid(){grid.innerHTML="";if(!reels.length){grid.innerHTML='<div class="grid-empty">No Reels available.</div>';return}reels.forEach((reel,index)=>{const button=document.createElement("button");button.className="grid-item";button.type="button";button.setAttribute("aria-label",`Open Reel ${index+1}`);const placeholder=document.createElement("div");placeholder.className="grid-placeholder";placeholder.textContent="▶";button.append(placeholder);if(reel.thumbnail){const image=document.createElement("img");image.src=reel.thumbnail;image.alt="";image.loading="lazy";image.onerror=()=>image.remove();button.prepend(image)}button.onclick=()=>closeGrid(index);grid.append(button)})}
function render(data){const rows=Array.isArray(data)?data:(Array.isArray(data?.reels)?data.reels:[]);reels=rows.map(row=>({url:normalizeInstagramUrl(row?.url||row?.link||row?.instagram),thumbnail:String(row?.thumbnail_url||row?.thumbnail||row?.image_url||row?.image||row?.cover||"").trim()})).filter(row=>row.url).reverse();feed.innerHTML="";slides=[];if(observer)observer.disconnect();if(!reels.length){showFeedError("No valid Instagram Reel links were returned by the sheet.");return}reels.forEach(makeReel);observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting&&entry.intersectionRatio>=.55){currentIndex=Number(entry.target.dataset.index);mountReel(entry.target);if(slides[currentIndex+1])mountReel(slides[currentIndex+1])}}),{root:feed,threshold:[.55,.75]});slides.forEach(slide=>observer.observe(slide));mountReel(slides[0])}
async function refreshReels(){if(!SHEET_API_URL.startsWith("https://script.google.com/")){showFeedError("The Google Apps Script Web App URL is not configured.");return}try{const result=await loadSheetData(SHEET_API_URL);if(result?.ok===false)throw new Error(result.error||"Google Sheets returned an error.");render(result)}catch(error){showFeedError(error.message||"Unable to get Reel links from Google Sheets.")}}
document.getElementById("backButton").onclick=()=>closeGrid(currentIndex);
// A left swipe on the feed opens the Reel collection; a right swipe on the grid returns to the current Reel.
document.addEventListener("touchstart",event=>{if(event.touches.length!==1)return;touchStart={x:event.touches[0].clientX,y:event.touches[0].clientY,page:gridPage.classList.contains("active")?"grid":"feed"}},{passive:true});
document.addEventListener("touchend",event=>{if(!touchStart||event.changedTouches.length!==1)return;const dx=event.changedTouches[0].clientX-touchStart.x,dy=event.changedTouches[0].clientY-touchStart.y;const start=touchStart;touchStart=null;if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.25)return;if(start.page==="feed"&&dx<0)openGrid();else if(start.page==="grid"&&dx>0)closeGrid(currentIndex)},{passive:true});
document.addEventListener("keydown",event=>{if(gridPage.classList.contains("active")){if(event.key==="Escape"||event.key==="ArrowRight")closeGrid(currentIndex);return}if(event.key==="ArrowDown"||event.key==="PageDown"){event.preventDefault();slides[Math.min(currentIndex+1,slides.length-1)]?.scrollIntoView({behavior:"smooth"})}if(event.key==="ArrowUp"||event.key==="PageUp"){event.preventDefault();slides[Math.max(currentIndex-1,0)]?.scrollIntoView({behavior:"smooth"})}});
refreshReels();
</script>
</body>
</html>
